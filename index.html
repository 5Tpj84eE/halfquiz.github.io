<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はんぶんクイズ</title>

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    /* 明るくやさしいパステルイエロー */
    background: #FFFDE7;
    /* 丸みのあるかわいらしいフォントを指定 */
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Meiryo UI", sans-serif;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* おもちゃのような白いカード風コンテナ */
  .app {
    text-align: center;
    background: #ffffff;
    padding: 30px 40px;
    border-radius: 30px;
    box-shadow: 0 10px 25px rgba(255, 183, 77, 0.3);
    border: 6px solid #FFE082;
    max-width: 90%;
    box-sizing: border-box;
  }

  h1 {
    font-size: 32px;
    margin-top: 0;
    margin-bottom: 20px;
    color: #FF7043; /* 親しみやすいオレンジ */
    text-shadow: 2px 2px 0px #FFE082;
    letter-spacing: 2px;
  }

  .line {
    font-size: 56px;
    margin: 15px 0;
    color: #37474F;
    font-weight: bold;
  }

  .answer-wrapper {
    position: relative;
    display: inline-block;
    font-weight: bold;
    font-size: 56px;
  }

  /* 幅基準用（常に2桁） */
  .answer-base {
    visibility: hidden;
    padding: 0 20px;
  }

  /* 実際の答え */
  .answer-text {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    visibility: hidden;
    color: #E91E63; /* ワクワクするピンク色 */
  }

  /* 答えを隠すカバー（はてなブロック風） */
  .answer-cover {
    position: absolute;
    inset: 0;
    background: #4FC3F7; /* 明るい水色 */
    color: #ffffff;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 6px 0 #0288D1; /* ぷっくりした立体感 */
    transition: transform 0.1s;
    
    /* 「？」マークを表示 */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .answer-cover::after {
    content: "❓";
    font-size: 40px;
  }

  .answer-cover:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0288D1;
  }

  /* もう一回ボタン */
  button {
    margin-top: 25px;
    font-size: 26px;
    font-weight: bold;
    padding: 14px 40px;
    border: none;
    border-radius: 50px;
    background: #66BB6A; /* やさしい黄緑色 */
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 6px 0 #388E3C; /* ボタンの立体感 */
    transition: transform 0.1s;
  }

  button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #388E3C;
  }
</style>
</head>

<body>

<div class="app">
  <h1>はんぶんクイズ</h1>

  <div class="line">
    <span id="question"></span>
  </div>

  <div class="line">
    <span class="answer-wrapper">
      <span class="answer-base">00</span>
      <span id="answer" class="answer-text"></span>
      <span id="cover" class="answer-cover"></span>
    </span>
  </div>

  <button onclick="generateQuiz()">もういっかい</button>
</div>

<script>
  let lastQuestion = null; // ← 前回の問題を保持

  function getRandomEvenNumber() {
    let n;
    do {
      n = Math.floor(Math.random() * 89) + 10;
    } while (n % 2 !== 0);
    return n;
  }

  function generateQuiz() {
    let num;

    // 同じ問題が連続しないようにする
    do {
      num = getRandomEvenNumber();
    } while (num === lastQuestion);

    lastQuestion = num;

    const half = num / 2;

    document.getElementById("question").textContent = num;
    document.getElementById("answer").textContent = half;

    // 初期状態に戻す
    document.getElementById("answer").style.visibility = "hidden";
    document.getElementById("cover").style.display = "flex";
  }

  document.getElementById("cover").addEventListener("click", () => {
    document.getElementById("answer").style.visibility = "visible";
    document.getElementById("cover").style.display = "none";
  });

  // 初回出題
  generateQuiz();
</script>

</body>
</html>
