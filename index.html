<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はんぶんクイズ</title>

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    background: #e0e0e0;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app {
    text-align: center;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 30px;
  }

  .line {
    font-size: 40px;
    margin: 20px 0;
  }

  .answer-wrapper {
    position: relative;
    display: inline-block;
    font-weight: bold;
  }

  /* 幅基準用（常に2桁） */
  .answer-base {
    visibility: hidden;
  }

  /* 実際の答え */
  .answer-text {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    visibility: hidden;
  }

  /* 灰色カバー */
  .answer-cover {
    position: absolute;
    inset: 0;
    background: #9e9e9e;
    cursor: pointer;
  }

  button {
    margin-top: 20px;
    font-size: 22px;
    padding: 12px 32px;
    border: none;
    border-radius: 6px;
    background: #3f51b5;
    color: #ffffff;
    cursor: pointer;
  }

  button:hover {
    background: #3f51b5;
  }
</style>
</head>

<body>

<div class="app">
  <h1>はんぶんクイズ</h1>

  <div class="line">

    <span id="question"></span>
  </div>

  <div class="line">

    <span class="answer-wrapper">
      <!-- 2桁サイズ固定用 -->
      <span class="answer-base">00</span>

      <!-- 実際の答え -->
      <span id="answer" class="answer-text"></span>

      <!-- 灰色の四角 -->
      <span id="cover" class="answer-cover"></span>
    </span>
  </div>

  <button onclick="generateQuiz()">もういっかい</button>
</div>

<script>
  function getRandomEvenNumber() {
    let n;
    do {
      n = Math.floor(Math.random() * 89) + 10;
    } while (n % 2 !== 0);
    return n;
  }

  function generateQuiz() {
    const num = getRandomEvenNumber();
    const half = num / 2;

    document.getElementById("question").textContent = num;
    document.getElementById("answer").textContent = half;

    // 初期状態に戻す
    document.getElementById("answer").style.visibility = "hidden";
    document.getElementById("cover").style.display = "block";
  }

  document.getElementById("cover").addEventListener("click", () => {
    document.getElementById("answer").style.visibility = "visible";
    document.getElementById("cover").style.display = "none";
  });

  // 初回出題
  generateQuiz();
</script>

</body>
</html>
