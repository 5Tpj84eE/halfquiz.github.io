<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はんぶんクイズ</title>
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <style>
    body {
      background-color: #e0e0e0;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      max-width: 600px;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .quiz-box {
      margin-top: 20px;
    }
    .result-box {
      margin-top: 20px;
    }
    h3, h4 {
      color: #333333;
    }
    button.mdl-button--accent {
      background-color: #607d8b;
      color: #ffffff;
    }
    button.mdl-button--accent:hover {
      background-color: #455a64;
    }
    .answer-box {
      display: inline-block;
      background-color: #9e9e9e;
      color: #9e9e9e;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
    }
    .answer-box.revealed {
      color: #000000;
      background-color: transparent;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container mdl-shadow--2dp">
    <h3>はんぶんクイズ</h3>

    <div class="result-box">
      <h4>もんだい：<span id="randomNumber"></span></h4>
      <h4>こたえ：<span id="halfValue" class="answer-box" onclick="revealAnswer()">タップして表示</span></h4>
    </div>

    <div class="quiz-box">
      <button id="generateBtn" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent">
        しゅつだい
      </button>
    </div>
  </div>

  <script>
    function getRandomEvenNumber() {
      const min = 10;
      const max = 98;
      let randomNum;
      do {
        randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
      } while (randomNum % 2 !== 0);
      return randomNum;
    }

    function generateQuiz() {
      const randomNum = getRandomEvenNumber();
      const halfValue = randomNum / 2;

      document.getElementById('randomNumber').textContent = randomNum;

      const halfSpan = document.getElementById('halfValue');
      halfSpan.textContent = "タップして表示";
      halfSpan.classList.remove('revealed');
      halfSpan.setAttribute('data-answer', halfValue);
    }

    function revealAnswer() {
      const halfSpan = document.getElementById('halfValue');
      const answer = halfSpan.getAttribute('data-answer');
      halfSpan.textContent = answer;
      halfSpan.classList.add('revealed');
    }

    // ページ読み込み時に最初の問題を出題
    window.addEventListener('DOMContentLoaded', generateQuiz);

    document.getElementById('generateBtn').addEventListener('click', generateQuiz);
  </script>

</body>
</html>
